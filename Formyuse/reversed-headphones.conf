context.modules = [
    { name = libpipewire-module-loopback
        args = {
            node.description = "Swapped Audio Device"
            capture.props = {
                node.name = "swapped_input"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "swapped_output"
                node.target = "alsa_output.usb-GeneralPlus_USB_Audio_Device-00.analog-stereo"
                audio.position = [ FR FL ]
                node.pause-on-idle = false
            }
        }
    }
]


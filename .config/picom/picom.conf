# ==========================================
# Picom Configuration File
# Optimized for Background Blur & Performance
# ==========================================

# --- Backend ---
# Required for dual_kawase blur and modern performance
backend = "glx";
vsync = true;

# --- Blur Settings ---
# Dual-Kawase is the highly recommended blur method for performance and visuals
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};

# Exclude specific windows from being blurred (like screenshots, docks, or desktop elements)
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading Effects ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# --- Opacity & Transparency Rules ---
active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 1.0;

# Make specific applications transparent so you can see the blur underneath
opacity-rule = [
  "85:class_g = 'Alacritty'",
  "85:class_g = 'Kitty'",
  "90:class_g = 'Rofi'",
  "90:class_g = 'Polybar'"
];

# --- General Corners ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

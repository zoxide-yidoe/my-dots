# ==========================================
# Picom Configuration File
# Optimized for Background Blur & Performance
# ==========================================

# --- Backend ---
# Required for dual_kawase blur and modern performance
backend = "glx";
vsync = true;

# --- Native Animations ---
# Using official presets to grow windows from zero size and shrink them on exit
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";          # Smoothly grows and fades the window in from nothing
    duration = 0.18;           # Tight, fast, and responsive timing
    scale = 0.95;              # Starts scaling from 95% size
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";       # Smoothly shrinks and fades the window away on exit
    duration = 0.15;           # Snappier close animation
    scale = 0.95;              # Shrinks down towards 95% as it disappears
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change"; # Handles smooth movement when windows move or resize
    duration = 0.15;
  }
);

# --- Blur Settings ---
# Dual-Kawase is the highly recommended blur method for performance and visuals
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};

# Exclude specific windows from being blurred (like screenshots, docks, or desktop elements)
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS"         # Deprecated ":c" removed to fix warning log
];

# --- Fading Effects ---
fading = true;
fade-in-step = 0.04;          # Tuned to sync perfectly with 0.18s animation
fade-out-step = 0.05;         # Tuned to sync perfectly with 0.15s animation
fade-delta = 5;

# --- Opacity & Transparency Rules ---
active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 1.0;

# Make specific applications transparent so you can see the blur underneath
opacity-rule = [
  "85:class_g = 'Alacritty'",
  "85:class_g = 'Kitty'",
  "90:class_g = 'Rofi'",
  "90:class_g = 'Polybar'"
];

# --- General Corners ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];


